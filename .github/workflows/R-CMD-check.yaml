# Workflow derived from https://github.com/r-lib/actions/tree/v2/examples
# Need help debugging build failures? Start at https://github.com/r-lib/actions#where-to-find-help
#
# NOTE: This workflow is overkill for most R packages and
# check-standard.yaml is likely a better choice.
# usethis::use_github_action("check-standard") will install it.
on:
  push:
    branches: [main, master]
    paths-ignore:
    - 'pkgdown/**'
    - '.github/workflows/pkgdown.yaml'
  pull_request:
    branches: [main, master]
    paths-ignore:
    - 'pkgdown/**'
    - '.github/workflows/pkgdown.yaml'
  workflow_dispatch:
    inputs:
      leg:
        description: "baseline (uninstrumented) or instrumented (under chalk/curiosity)"
        type: choice
        options: [instrumented, baseline]
        default: instrumented
      profile:
        description: "CrashOverride chalk profile"
        type: string
        default: curiosity-tests-racecar
      racecar_run:
        description: "racecar correlation token, echoed into the run name"
        type: string
        default: ""

name: R-CMD-check

permissions:
  contents: read
  id-token: write

env:
  # The one variable that separates the arms: on baseline, action-checkout
  # skips its Set up Chalk step entirely.
  CHALK_ON: ${{ inputs.leg == 'instrumented' }}

run-name: "R-CMD-check ${{ inputs.leg || 'push' }} ${{ inputs.racecar_run }}"

jobs:
  R-CMD-check:
    runs-on: ${{ matrix.config.os }}

    name: ${{ matrix.config.os }} (${{ matrix.config.r }}) [Pandoc ${{matrix.config.pandoc}}]

    strategy:
      fail-fast: false
      matrix:
        config:
          # testing R release with last shipped pandoc version in RStudio IDE and new pandoc
        - {os: ubuntu-latest, pandoc: 'latest', r: 'release'}
        - {os: ubuntu-latest, pandoc: 'nightly', r: 'release'}
          # testing older pandoc versions (rmarkdown requires Pandoc >= 2.8)
        - {os: ubuntu-latest, pandoc: '3.8.3', r: 'release'}
        - {os: ubuntu-latest, pandoc: '3.1.11', r: 'release'}
        - {os: ubuntu-latest, pandoc: '2.19.2', r: 'release'}
        - {os: ubuntu-latest, pandoc: '2.18', r: 'release'}
        - {os: ubuntu-latest, pandoc: '2.17.1.1', r: 'release'}
        - {os: ubuntu-latest, pandoc: '2.16.2', r: 'release'}
        - {os: ubuntu-latest, pandoc: '2.14.2', r: 'release'}
        - {os: ubuntu-latest, pandoc: '2.11.4', r: 'release'}
        - {os: ubuntu-latest, pandoc: '2.8', r: 'release'}
          # testing other R versions
        - {os: ubuntu-latest, pandoc: 'latest', r: 'devel'}
        - {os: ubuntu-latest, pandoc: 'latest', r: 'oldrel-1'}
        - {os: ubuntu-latest, pandoc: 'latest', r: 'oldrel-2'}
        - {os: ubuntu-latest, pandoc: 'latest', r: 'oldrel-3'}

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes
      USE_BUNDLED_LIBUV: 1

    permissions:
      actions: read
      contents: read
      id-token: write

    steps:
    - name: Checkout code
      uses: crashappsec/action-checkout@main
      with:
        chalk: ${{ env.CHALK_ON }}
        profile: ${{ inputs.profile || 'curiosity-tests-racecar' }}
        observables_continue_on_error: false
        lfs: false
    - uses: r-lib/actions/setup-r@v2
      with:
        r-version: ${{ matrix.config.r }}
        use-public-rspm: true

    - name: change temp dir
      if: runner.os == 'Windows'
      run: echo "TMPDIR=${{ runner.temp }}" >> $GITHUB_ENV
      shell: bash

    - uses: r-lib/actions/setup-tinytex@v2
      env:
          # install full prebuilt version
        TINYTEX_INSTALLER: TinyTeX

    - uses: yihui/actions/setup-r-dependencies@HEAD
      with:
        apt-packages: ${{ matrix.config.r == 'devel' && 'libcurl4-openssl-dev' || '' }}

    - name: Remove default installed Pandoc
      if: runner.os == 'Linux'
      run: sudo dpkg -r pandoc

    - uses: r-lib/actions/setup-pandoc@v2
      with:
        pandoc-version: ${{ matrix.config.pandoc }}
        token: ${{ secrets.GITHUB_TOKEN }}

    - name: Pandoc and Tinytex info
      run: |
        rmarkdown::find_pandoc()
        tinytex::tlmgr("--version")
        tinytex::tl_pkgs()
      shell: Rscript {0}

    - uses: yihui/actions/check-r-package@HEAD

    - name: Test coverage
      if: success() && runner.os == 'Linux' && matrix.config.r == 'release' && matrix.config.pandoc == 'latest'
      run: |
        xfun::pkg_load2('covr')
        covr::codecov()
      shell: Rscript {0}
    - name: Check observables and crashes
      if: always() && env.CHALK_ON == 'true'
      shell: bash
      run: |
        set -uo pipefail
        root="${CURIOSITY_ROOT:-}"
        home="${CURIOSITY_HOME:-/mnt/curiosity}"
        obs="${home}/observables"
        fail=0

        echo "::group::curiosity layout"
        echo "CURIOSITY_ROOT=${root:-<unset>}"
        echo "CURIOSITY_HOME=${home}"
        ls -la "${obs}" 2>/dev/null || echo "no observables dir at ${obs}"
        echo "::endgroup::"

        # Observables for THIS run+attempt. The prefix matters: a stale file from an
        # earlier run on the same mount would otherwise pass.
        prefix="${GITHUB_RUN_ID}_${GITHUB_RUN_ATTEMPT}"
        shopt -s nullglob
        mine=("${obs}/${prefix}"*)
        if [ ${#mine[@]} -eq 0 ]; then
          mine=("${obs}/${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-observables"*)
        fi
        if [ ${#mine[@]} -eq 0 ]; then
          echo "::error::no observables for run ${prefix} in ${obs} - instrumentation produced nothing"
          fail=1
        else
          echo "observables present: ${#mine[@]} file(s)"
          printf '  %s\n' "${mine[@]}"
        fi

        for f in "${mine[@]}"; do
          case "$f" in
            *.jsonl|*.json|*.combined)
              if ! jq --slurp "." "$f" > /dev/null 2>&1; then
                echo "::error::observables do not parse: $f"
                fail=1
              fi
              ;;
          esac
        done

        # Crash thresholds copied from check-run: a few null frames are noise, more than
        # five is a stack walk into nothing.
        for f in "${root}"/log/co-host*.log "${home}"/log/co-host*.log; do
          [ -f "$f" ] || continue
          echo "Asserting that there is no crash in $f"
          if [ "$(grep -c 'p 00000000' "$f" 2>/dev/null || echo 0)" -gt 5 ] \
            || [ "$(grep -E -c 'FATAL: Uncaught signal|Address not mapped at|RAX 0x.*RBX 0x' "$f" 2>/dev/null || echo 0)" -gt 1 ]; then
            echo "::error::crash signature in $f"
            grep -E 'FATAL: Uncaught signal|Address not mapped at' "$f" | head -5 || true
            fail=1
          fi
        done

        cores=("${root}"/coredump.* "${home}"/coredump.*)
        if [ ${#cores[@]} -gt 0 ]; then
          echo "::error::coredump present: ${cores[*]}"
          fail=1
        fi

        for f in "${root}"/runc.log "${root}"/runc.global.log \
                 "${home}"/runc.log "${home}"/runc.global.log; do
          [ -f "$f" ] || continue
          if grep -q '^E:' "$f"; then
            echo "::error::error in $f"
            grep '^E:' "$f" | head -5
            fail=1
          fi
        done

        if [ "$fail" -ne 0 ]; then
          echo "::error::instrumentation check FAILED"
          exit 1
        fi
        echo "instrumentation check passed"
